[package]
name = "nasiko-llm-router"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

# Optional standalone service (P2.9). The router normally runs in-process in
# nasiko-server; this binary serves the same router(ctx) as its own process.
[[bin]]
name = "llm-router"
path = "src/bin/llm-router.rs"

[dependencies]
# Internal â€” AES-GCM (per-user HKDF) decrypt of user_secrets via try_for_user
nasiko-secrets.workspace = true
nasiko-pricing.workspace = true
nasiko-savings.workspace = true
# Internal â€” structural payload compression at the egress seam (src/compress.rs)
nasiko-compress.workspace = true

# Web / async
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Query classifier â€” regex categories + Thompson-sampling tier selection
regex = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

# Storage & outbound HTTP (the crate owns these via LlmRouterCtx â€” no nasiko-server dep)
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
futures = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }

# Auth (agent-identity JWT verify)
jsonwebtoken = { workspace = true }

# Resolver cache + identifiers
dashmap = { workspace = true }
uuid = { workspace = true }

# Router decision cache (S3) â€” sticky (conv_id, agent_id) â†’ model across turns/scale
redis = { workspace = true }

# Errors / time / logging
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Used only by the standalone `llm-router` binary for log output.
tracing-subscriber = { workspace = true }

# AWS SDK for Bedrock (P2 Request Classifier - hosted backend)
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.63.0"

# Configuration parsing (P2 Request Classifier - TOML config files)
toml = "0.8"

# Lazy static for regex compilation (P2 Request Classifier)
lazy_static = "1.4"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
base64 = { workspace = true }
mockito = { workspace = true }
tower = { workspace = true }
zstd.workspace = true
