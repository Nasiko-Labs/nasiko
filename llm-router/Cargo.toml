[package]
name = "nasiko-llm-router"
edition.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

# Optional standalone service (P2.9). The router normally runs in-process in
# nasiko-server; this binary serves the same router(ctx) as its own process.
[[bin]]
name = "llm-router"
path = "src/bin/llm-router.rs"

[dependencies]
# Internal
nasiko-secrets.workspace = true
nasiko-pricing.workspace = true
nasiko-savings.workspace = true
nasiko-compress.workspace = true

# Web / async
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Query classifier
regex = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }

# Optional MiniLM
fastembed = { version = "5", optional = true }

# Storage & outbound HTTP
sqlx = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
futures = { workspace = true }
async-stream = { workspace = true }
bytes = { workspace = true }

# Auth
jsonwebtoken = { workspace = true }

# Resolver cache + identifiers
dashmap = { workspace = true }
uuid = { workspace = true }

# Router decision cache
redis = { workspace = true }

# Errors / time / logging
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = ["minilm"]
minilm = ["dep:fastembed"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
base64 = { workspace = true }
mockito = { workspace = true }
tower = { workspace = true }
zstd.workspace = true