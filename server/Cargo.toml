[package]
name = "nasiko-server"
edition.workspace = true
version.workspace = true
# Three binaries share this package (the server and two demo seeders); `default-run` makes
# `cargo run -p nasiko-server` mean the server.
default-run = "nasiko-server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nasiko-server"
path = "src/main.rs"

[[bin]]
name = "seed-finops-demo"
path = "src/bin/seed_finops_demo.rs"

[[bin]]
name = "seed-fleet-demo"
path = "src/bin/seed_fleet_demo.rs"

[dependencies]
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
dotenvy.workspace = true
nasiko-coding-policy.workspace = true
nasiko-agent-proxy.workspace = true
nasiko-auth.workspace = true
nasiko-flow.workspace = true
nasiko-hitl.workspace = true
nasiko-mcp-gateway.workspace = true
nasiko-secrets.workspace = true
nasiko-github = { workspace = true }
nasiko-oci.workspace = true
nasiko-pricing.workspace = true
nasiko-event-store.workspace = true
nasiko-runtime = { workspace = true, features = ["docker", "simulated"] }
nasiko-react-agent.workspace = true
# IP-3's turn-level savings row (src/telemetry/tool_result_savings.rs)
nasiko-savings.workspace = true
nasiko-compress.workspace = true
nasiko-orchestrator.workspace = true
nasiko-types.workspace = true
nasiko-utils.workspace = true
# Decodes query-string keys before log redaction (src/mcp/mod.rs).
percent-encoding = { workspace = true }
nasiko-config.workspace = true
nasiko-observability.workspace = true
nasiko-llm-router.workspace = true
# Coding-agent (ACP) turn execution: the ACP client speaks JSON-RPC to the
# agent, `agent-client-protocol` supplies the `ByteStreams` transport + schema
# types, and `tokio-util`'s compat shim bridges the runtime's tokio stdio halves
# to the SDK's futures-io transport.
nasiko-acp-client.workspace = true
nasiko-session-token.workspace = true
agent-client-protocol = { workspace = true }
tokio-util = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
http-body = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
nasiko-redis = { workspace = true }
nasiko-leader = { workspace = true }
rustls = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rust_decimal = { workspace = true }
zip = { workspace = true }
semver = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
aes-gcm = "0.10"
hkdf = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
nasiko-spa = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }

# OpenTelemetry
opentelemetry = { version = "0.28", features = ["metrics"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
tracing-opentelemetry = "0.29"
tonic = "0.12"
sentry = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serial_test = { workspace = true }
tower = { workspace = true, features = ["util"] }
reqwest = { workspace = true, features = ["multipart"] }
uuid = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# assertion_sign_in generates its own Ed25519 key per run, so no private key is ever committed.
ring = { workspace = true }
mockito = { workspace = true }
zstd = { workspace = true }
criterion = { workspace = true }
nasiko-bench-support = { workspace = true }
# The harness turn e2e runs the real shim in-process.
nasiko-harness-shim = { workspace = true }

[[bench]]
name = "control_plane"
harness = false
