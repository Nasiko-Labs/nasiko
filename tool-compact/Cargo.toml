[package]
name = "nasiko-tool-compact"
version = "0.1.0"
edition = "2021"
description = "High-efficiency compact tool schema encoder and streaming DFA decoder for Nasiko LLM Router"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Nasiko-Labs/nasiko"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1.0"
