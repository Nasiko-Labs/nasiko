services:
  growth-agent:
    build: .
    container_name: growth-agent
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - MODEL=${MODEL}
    ports:
      - "10005:10003"
    networks:
      - agents-net
    volumes:
      - ./data:/app/data

networks:
  agents-net:
    external: true
