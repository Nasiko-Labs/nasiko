[package]
name = "nasiko-session-token"
version.workspace = true
edition.workspace = true

# Shared session-bound token for ACP coding agents (NAS-839): the credential the
# control plane mints at session open carrying {agent_id, user_id, session_id,
# flow_id, jti}, verified identically by the MCP gateway and the LLM router.
#
# The crypto half (mint, verify signature + expiry, extract claims) is pure. The
# DB-side checks (jti revocation) stay in the callers; the one DB touch here is
# the per-turn flow attribution lookup both callers share (`attribution`).

[dependencies]
jsonwebtoken = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
