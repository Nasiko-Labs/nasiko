services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nasiko
      POSTGRES_PASSWORD: nasiko
      POSTGRES_DB: nasiko_dev
    ports:
      - "5432:5432"
    volumes:
      - nasiko-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rustfs:
    image: ghcr.io/rustfs/rustfs:latest
    command: server /data --address :9000
    environment:
      RUSTFS_ROOT_USER: nasiko
      RUSTFS_ROOT_PASSWORD: nasiko123
    ports:
      - "9000:9000"
    volumes:
      - nasiko-s3-data:/data


volumes:
  nasiko-pg-data:
  nasiko-s3-data:
