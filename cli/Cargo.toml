[package]
name = "nasiko"
edition.workspace = true
# Its own version, not the workspace's: the CLI is released on its own (`just release-cli-oss`), and
# `nasiko --version` must match the tag it was published under.
version = "0.2.1"

[lib]
name = "nasiko"
path = "src/lib.rs"

[[bin]]
name = "nasiko"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
strsim.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
ureq.workspace = true
dialoguer.workspace = true
indicatif.workspace = true
dirs.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true
which.workspace = true
include_dir.workspace = true
base64.workspace = true
uuid.workspace = true
nasiko-types.workspace = true
nasiko-utils.workspace = true
ratatui.workspace = true
crossterm.workspace = true
chrono.workspace = true
tabled.workspace = true
zip.workspace = true
rusqlite.workspace = true
# A plain dependency rather than `[target.'cfg(unix)'.dependencies]`: `libc` builds on every
# platform, and the Unix-only signal code that uses it is gated with `#[cfg(unix)]` in hitl.rs.
# (A target-gated table would also work: scripts/gen-oss-cargo-toml keeps workspace
# dependencies used from `[target.*]` tables too.)
libc.workspace = true

[dev-dependencies]
mockito.workspace = true
tempfile.workspace = true
