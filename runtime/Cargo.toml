[package]
name = "nasiko-runtime"
edition.workspace = true
version.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = "0.1"
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

serde_json = { workspace = true, optional = true }

# docker feature
bollard = { version = "0.17", optional = true }
futures-util = { version = "0.3", optional = true }

# k8s feature
kube = { version = "0.99", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_31"], optional = true }
object_store = { version = "0.10", features = ["aws"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
bytes = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[features]
default = ["docker"]
docker = ["dep:bollard", "dep:futures-util"]
k8s = [
    "dep:kube",
    "dep:k8s-openapi",
    "dep:serde_json",
    "dep:futures-util",
    "dep:object_store",
    "dep:uuid",
    "dep:bytes",
    "dep:reqwest",
]