[workspace]
resolver = "3"
members = [
    # ─── OSS crates ─────────────────────────────────────────────────────────
    "auth",
    "compress",
    "config",
    "secrets",
    "observability",
    "pricing",
    "event-store",
    "savings",
    "runtime",
    "react-agent",
    "acp-client",
    "harness-shim",
    "session-token",
    "orchestrator",
    "types",
    "utils",
    "server",
    "spa",
    "coding-policy",
    "oci",
    "flow",
    "redis",
    "leader",
    "hitl",
    "agent-proxy",
    "llm-router",
    "tool-compact",
    "mcp-gateway",
    "cli",
    "github",
    "bench",
    "bench-support",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ─── Internal OSS crates ────────────────────────────────────────────────────
nasiko-auth = { path = "auth" }
nasiko-compress = { path = "compress" }
nasiko-config = { path = "config" }
nasiko-pricing = { path = "pricing" }
nasiko-event-store = { path = "event-store" }
nasiko-savings = { path = "savings" }
nasiko-flow = { path = "flow" }
nasiko-redis = { path = "redis" }
nasiko-leader = { path = "leader" }
nasiko-hitl = { path = "hitl" }
nasiko-agent-proxy = { path = "agent-proxy" }
nasiko-mcp-gateway = { path = "mcp-gateway" }
nasiko-github = { path = "github" }
nasiko-secrets = { path = "secrets" }
nasiko-observability = { path = "observability" }
nasiko-runtime = { path = "runtime", default-features = false }
nasiko-react-agent = { path = "react-agent" }
nasiko-acp-client = { path = "acp-client" }
nasiko-harness-shim = { path = "harness-shim" }
nasiko-session-token = { path = "session-token" }
nasiko-orchestrator = { path = "orchestrator" }
nasiko-types = { path = "types" }
nasiko-utils = { path = "utils" }
nasiko-server = { path = "server" }
nasiko-spa = { path = "spa" }
nasiko-coding-policy = { path = "coding-policy" }
nasiko-oci = { path = "oci" }
nasiko-llm-router = { path = "llm-router" }
nasiko-tool-compact = { path = "tool-compact" }
nasiko-bench-support = { path = "bench-support" }

# ─── Testing ────────────────────────────────────────────────────────────────
serial_test = "3"

# ─── Async runtime & web ────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json", "query", "multipart", "ws"] }
tower = "0.5"
# Already in the tree through axum; named for the server's own accept loop (`nasiko_server::serve`).
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1", "http2"] }
tower-http = { version = "0.6", features = ["cors", "trace", "decompression-zstd"] }

# ─── OpenAPI docs ───────────────────────────────────────────────────────────
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# ─── Serialization ──────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
# `raw_value`: the agent state API stores and returns JSON bodies byte for byte, never re-encoded.
serde_json = { version = "1", features = ["raw_value"] }

# ─── Text / patterns ────────────────────────────────────────────────────────
regex = "1"

# ─── Database & state ───────────────────────────────────────────────────────
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal", "migrate", "json", "tls-rustls"] }
redis = { version = "0.27", features = ["tokio-comp", "aio", "tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }
rust_decimal = { version = "1.36", features = ["serde", "db-postgres"] }

# ─── Auth ───────────────────────────────────────────────────────────────────
jsonwebtoken = "9"
bcrypt = "0.15"

# ─── HTTP client ────────────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", features = ["ring"] }
# The ACP WebSocket client builds its own rustls config to add a private CA to the public roots.
rustls-pki-types = "1"
webpki-roots = "1"
# Test-only: a throwaway TLS server for the private-CA WebSocket test.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# ─── LLM orchestration ──────────────────────────────────────────────────────
# Exact-pinned, not a "0.11" caret range: the orchestrator's HITL pause detection
# (oss/react-agent) recovers a tool error through rig's type-erasure boxing, verified
# against this exact version's `ToolSetError`/`ToolError::ToolCallError` shape
# (rig-core-0.11.1/src/tool.rs). A `cargo update` under a caret range could silently
# move that boxing behavior without anything here noticing.
rig-core = { version = "=0.11.1", default-features = false, features = ["derive"] }

# ─── CLI ────────────────────────────────────────────────────────────────────
toml_edit = "0.25"
# `string`: lets `nasiko completions` rebuild the command tree without hidden subcommands
# (clap_complete would otherwise offer internal helpers like `__coding-agent-token` on TAB).
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
# Edit distance for the CLI's "did you mean '<agent>'?" hint; already in the build via clap.
strsim = "0.11"
ureq = { version = "3", features = ["json"] }
dialoguer = "0.11"
indicatif = "0.17"
dirs = "6"
tar = "0.4"
flate2 = "1"
which = "7"
include_dir = "0.7"
ratatui = "0.29"
crossterm = "0.29"
tabled = { version = "0.21", features = ["ansi"] }
# Already pulled in transitively via console (dialoguer's dep) at this exact version; declared
# directly here only for `oss/cli`'s own scoped SIGINT no-op guard (hitl.rs) — see its doc
# comment for why dialoguer/console's own Ctrl+C handling can't be used for this instead.
libc = "0.2"
# Read-only access to coding agents' local history stores (OpenCode's opencode.db, Cursor's
# state.vscdb) for `nasiko agents setup/import`. Pinned to 0.32 because it links the same
# libsqlite3-sys (0.30) that sqlx's optional sqlite driver already puts in the lockfile — two
# crates may not both link `sqlite3`.
rusqlite = { version = "0.32", features = ["bundled"] }

# ─── Observability ──────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error and crash reporting to Sentry, off unless SENTRY_DSN is set (oss/server/src/error_reporting/).
# ureq + rustls: the HTTP stack and TLS the workspace already locks, instead of the default
# reqwest 0.13 + native-tls. `tower-axum-matched-path` names transactions by route template, so a
# credential in a path (`/api/mcp/s/{token}`) never becomes a transaction name.
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "tower", "tower-http", "tower-axum-matched-path", "ureq", "rustls", "logs"] }

# ─── AWS ────────────────────────────────────────────────────────────────────
aws-sdk-s3 = "1"
aws-config = "1"

# ─── Crypto ─────────────────────────────────────────────────────────────────
sha2 = "0.10"
# Already resolved transitively via jsonwebtoken; a direct dep for Ed25519
# keygen (ring::signature::Ed25519KeyPair).
ring = "0.17"
hkdf = "0.12"
hmac = "0.12"
hex = "0.4"
rand = "0.9"
rand_distr = "0.5"

# ─── Temp filesystem ────────────────────────────────────────────────────────
tempfile = "3"

# ─── Archive ────────────────────────────────────────────────────────────────
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
# Word/Excel XML parts (llm-router). 0.42 is the copy the lock already holds.
quick-xml = { version = "0.42", default-features = false }

# ─── Versioning ─────────────────────────────────────────────────────────────
semver = "1"

# ─── Concurrency ───────────────────────────────────────────────────────────
dashmap = "6"
bytes = "1"

# ─── Columnar cold tier (oss/event-store only) ─────────────────────────────
# Lance builds need `protoc` on PATH. Arrow must match the version Lance links.
# `gcp` for native `gs://` cold paths: GCS's S3 API ignores If-None-Match, so
# commits there are atomic only through the native API.
lance = { version = "13.0.0", default-features = false, features = ["aws", "gcp"] }
lance-io = { version = "13.0.0", default-features = false, features = ["aws", "gcp"] }
lance-index = "13.0.0"
lance-linalg = "13.0.0"
arrow-array = "58"
arrow-schema = "58"

# ─── Async traits ───────────────────────────────────────────────────────────
async-trait = "0.1"

# ─── Streaming ──────────────────────────────────────────────────────────────
futures = "0.3"
async-stream = "0.3"
# `compat` bridges tokio AsyncRead/AsyncWrite (what the runtime's StdioHandle
# exposes) to the futures-io traits the ACP SDK's `ByteStreams` transport wants,
# so a coding-agent container attach can drive an `AcpConnection`.
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

# ─── Agent Client Protocol (coding-agent transport) ─────────────────────────
# Official Rust SDK for ACP (Agent Client Protocol). Pinned to the v1 schema;
# `unstable_*` features are deliberately left off (see oss/acp-client).
agent-client-protocol = "2.2.0"

# ─── Common utilities ───────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
# Metrics API only (no SDK): the process that links a meter provider decides where they go.
# Same version `oss/server` pins for its own instruments, so both resolve to one crate.
opentelemetry = { version = "0.28", features = ["metrics"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"
anyhow = "1"
base64 = "0.22"
dotenvy = "0.15"
http = "1"
http-body = "1"

# ─── Embedding / registry ──────────────────────────────────────────────────
rust-embed = { version = "8", features = ["mime-guess", "include-exclude", "interpolate-folder-path"] }
mime_guess = "2"
percent-encoding = "2"

mockito = "1"

# ─── Benchmarking ───────────────────────────────────────────────────────────
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
strip = true
# codegen-units = 1
