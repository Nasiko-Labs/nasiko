<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/chat-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <chat-page>
      <div style="display:flex;flex-direction:column;height:calc(100vh - 60px);max-width:900px;margin:0 auto;padding:var(--space-md);">
        <div style="display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) 0;border-bottom:1px solid var(--color-border);">
          <div class="skel-card__avatar" style="width:32px;height:32px;border-radius:var(--radius-full);"></div>
          <div class="skel-card__line" style="width:100px;"></div>
        </div>
        <div style="flex:1;"></div>
        <div class="skel-block" style="height:56px;border-radius:var(--radius-lg);"></div>
      </div>
    </chat-page>
  </body>
</html>
