<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose. theme.js is a deferred ES module, so without this the
         skeleton flashes the OS theme. The rail width is set here too as the fallback for browsers
         without the `blocking` script attribute (Firefox), where app-header.js is still plain deferred
         and an expanded rail would collapse and re-expand on every MPA navigation.
         Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded-v2')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <!-- blocking=render: the shell has to be painted (and view-transition-named)
         before the browser snapshots this document for the cross-document
         transition. A plain deferred module runs after that snapshot, so the
         incoming page was captured with an empty header and the whole shell
         cross-faded on every navigation. -->
    <script type="module" blocking="render" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/add-agent-github-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <add-agent-github-page>
      <!-- Back link, title + subtitle, 400px search well, repo list rows. -->
      <div class="skel-card__line" style="width:60px;height:20px;margin-bottom:var(--space-md);"></div>
      <div style="display:flex;flex-direction:column;gap:var(--space-xs);margin-bottom:var(--space-md);">
        <div class="skel-card__line" style="height:28px;width:240px;"></div>
        <div class="skel-card__line" style="width:480px;max-width:70vw;"></div>
      </div>
      <div class="skel-block" style="height:36px;max-width:400px;border-radius:var(--r-8);margin-bottom:var(--space-md);"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) 0;border-bottom:1px solid var(--color-border);"><div class="skel-card__line" style="width:220px;"></div><div class="skel-card__btn" style="width:80px;"></div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) 0;border-bottom:1px solid var(--color-border);"><div class="skel-card__line" style="width:180px;"></div><div class="skel-card__btn" style="width:80px;"></div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) 0;border-bottom:1px solid var(--color-border);"><div class="skel-card__line" style="width:260px;"></div><div class="skel-card__btn" style="width:80px;"></div></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) 0;border-bottom:1px solid var(--color-border);"><div class="skel-card__line" style="width:200px;"></div><div class="skel-card__btn" style="width:80px;"></div></div>
    </add-agent-github-page>
  </body>
</html>
