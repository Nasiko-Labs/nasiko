<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose: both theme.js and app-header.js are deferred ES modules, so they apply the stored theme / rail width only after first paint —
         the skeleton would flash the OS theme, and an expanded rail would collapse and re-expand on every MPA navigation. Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/flow-detail-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <flow-detail-page>
      <!-- Title + back link, query line, 5-cell KPI strip, then step rows. -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-md);">
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
          <div class="skel-card__line" style="height:28px;width:190px;"></div>
          <div class="skel-card__line" style="width:400px;max-width:50vw;"></div>
        </div>
        <div class="skel-card__line" style="width:120px;"></div>
      </div>
      <div style="display:flex;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);margin:var(--space-lg) 0;">
        <div style="flex:1;padding:var(--space-md) var(--space-md) var(--space-md) 0;display:flex;flex-direction:column;gap:var(--space-sm);"><div class="skel-card__line" style="width:60px;"></div><div class="skel-card__line" style="height:22px;width:110px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-sm);"><div class="skel-card__line" style="width:70px;"></div><div class="skel-card__line" style="height:22px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-sm);"><div class="skel-card__line" style="width:60px;"></div><div class="skel-card__line" style="height:22px;width:80px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-sm);"><div class="skel-card__line" style="width:60px;"></div><div class="skel-card__line" style="height:22px;width:150px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-sm);"><div class="skel-card__line" style="width:50px;"></div><div class="skel-card__line" style="height:22px;width:30px;"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-xs);margin-bottom:var(--space-md);">
        <div class="skel-card__line" style="height:22px;width:70px;"></div>
        <div class="skel-card__line" style="width:460px;max-width:60vw;"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm);">
        <div class="skel-block" style="height:64px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:64px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:64px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:64px;border-radius:var(--r-8);"></div>
      </div>
    </flow-detail-page>
  </body>
</html>
