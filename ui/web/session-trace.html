<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko — Session Trace</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose: theme.js is a deferred ES module, so it applies the stored theme after first paint and the pre-JS skeleton flashes the OS theme. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/session-trace-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <session-trace-page trace-id="8a880df26caf4c12a0e2d5f898f49420">
      <!-- Back pill + trace id, stat row, then span rows (full width). -->
      <div style="display:flex;align-items:center;gap:var(--space-md);padding-bottom:var(--space-md);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-md);">
        <div class="skel-card__btn" style="width:90px;height:36px;"></div>
        <div class="skel-card__line" style="height:24px;width:420px;max-width:50vw;"></div>
      </div>
      <div style="display:flex;gap:var(--space-2xl,48px);padding-bottom:var(--space-md);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-lg);">
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:50px;"></div><div class="skel-card__line" style="height:20px;width:40px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:70px;"></div><div class="skel-card__line" style="height:20px;width:60px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:60px;"></div><div class="skel-card__line" style="height:20px;width:70px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:40px;"></div><div class="skel-card__line" style="height:20px;width:60px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:60px;"></div><div class="skel-card__line" style="height:20px;width:90px;"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-sm);">
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
      </div>
    </session-trace-page>
  </body>
</html>
