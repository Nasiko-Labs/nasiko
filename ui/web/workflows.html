<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko — Workflows</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose. theme.js is a deferred ES module, so without this the
         skeleton flashes the OS theme. The rail width is set here too as the fallback for browsers
         without the `blocking` script attribute (Firefox), where app-header.js is still plain deferred
         and an expanded rail would collapse and re-expand on every MPA navigation.
         Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded-v2')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <!-- blocking=render: the shell has to be painted (and view-transition-named)
         before the browser snapshots this document for the cross-document
         transition. A plain deferred module runs after that snapshot, so the
         incoming page was captured with an empty header and the whole shell
         cross-faded on every navigation. -->
    <script type="module" blocking="render" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/workflows-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <workflows-page>
      <!-- Pre-upgrade paint: real header and controls (they need no backend and must
           not move), shimmer only for what the API feeds. The component replaces
           all of this on upgrade — see common/styles/not-defined.css. -->
      <div class="pre-modnav"></div>
      <div class="pre-head pre-head--split" style="--pre-head-gap:var(--s-4);--pre-action-gap:var(--space-2xs)">
        <div>
          <h1 class="title-page">Workflows</h1>
          <p style="font-size:13px;line-height:18px">Reusable multi-agent sequences you can run on demand.</p>
        </div>
        <div class="pre-head__actions">
          <span class="pre-action pre-action--solid">Create workflow <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:13px;height:13px;flex-shrink:0"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
        </div>
      </div>
      <div class="pre-grid" style="--pre-col:300px;--pre-gap:var(--s-16);--pre-card-h:176px;--pre-card-pad:var(--s-20);--pre-card-gap:var(--s-12)">
        <div class="pre-card">
          <div class="pre-line pre-line--name"></div>
          <div class="pre-tags"><div class="pre-tag"></div><div class="pre-tag"></div></div>
          <div class="pre-line" style="width:70%"></div>
          <div class="pre-line" style="width:55%"></div>
        </div>
        <div class="pre-card">
          <div class="pre-line pre-line--name"></div>
          <div class="pre-tags"><div class="pre-tag"></div><div class="pre-tag"></div></div>
          <div class="pre-line" style="width:70%"></div>
          <div class="pre-line" style="width:55%"></div>
        </div>
        <div class="pre-card">
          <div class="pre-line pre-line--name"></div>
          <div class="pre-tags"><div class="pre-tag"></div><div class="pre-tag"></div></div>
          <div class="pre-line" style="width:70%"></div>
          <div class="pre-line" style="width:55%"></div>
        </div>
      </div>
    </workflows-page>
  </body>
</html>
