<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose: both theme.js and app-header.js are deferred ES modules, so they apply the stored theme / rail width only after first paint —
         the skeleton would flash the OS theme, and an expanded rail would collapse and re-expand on every MPA navigation. Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/secrets-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <secrets-page>
      <!-- Title/sub, secrets list, inline add row, note well. -->
      <div style="display:flex;flex-direction:column;gap:var(--space-xs);margin-bottom:var(--space-lg);">
        <div class="skel-card__line" style="height:28px;width:120px;"></div>
        <div class="skel-card__line" style="width:480px;max-width:60vw;"></div>
      </div>
      <div class="skel-block" style="height:176px;border-radius:var(--r-8);margin-bottom:var(--space-md);"></div>
      <div style="display:flex;align-items:flex-end;gap:var(--space-sm);">
        <div class="skel-block" style="flex:0 1 34%;height:32px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="flex:1;height:32px;border-radius:var(--r-8);"></div>
        <div class="skel-card__btn" style="width:104px;height:32px;"></div>
      </div>
      <div class="skel-block" style="height:44px;border-radius:var(--r-8);margin-top:var(--space-lg);"></div>
    </secrets-page>
  </body>
</html>
