<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose: both theme.js and app-header.js are deferred ES modules, so they apply the stored theme / rail width only after first paint —
         the skeleton would flash the OS theme, and an expanded rail would collapse and re-expand on every MPA navigation. Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/tokenops-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <tokenops-page>
      <!-- Mirrors the loaded page: head (title/sub + period select/export),
           KPI strip (hairline top/bottom, 4 columns), toolbar + cost table. -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-md);margin-bottom:var(--space-lg);">
        <div style="display:flex;flex-direction:column;gap:var(--space-xs);">
          <div class="skel-card__line" style="height:28px;width:160px;"></div>
          <div class="skel-card__line" style="width:380px;max-width:60vw;"></div>
        </div>
        <div style="display:flex;gap:var(--space-sm);">
          <div class="skel-card__btn" style="width:120px;height:36px;"></div>
          <div class="skel-card__btn" style="width:90px;height:36px;"></div>
        </div>
      </div>
      <div style="display:flex;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);margin-bottom:var(--space-xl);">
        <div style="flex:1;padding:var(--space-md) var(--space-md) var(--space-md) 0;display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--space-md);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--space-xs);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
      </div>
      <div class="skel-card__line" style="height:20px;width:110px;margin-bottom:var(--space-md);"></div>
      <div style="display:flex;gap:var(--space-md);margin-bottom:var(--space-md);">
        <div class="skel-block" style="height:36px;width:340px;max-width:50vw;border-radius:var(--r-8);"></div>
        <div style="flex:1;"></div>
        <div class="skel-block" style="height:36px;width:130px;border-radius:var(--r-8);"></div>
      </div>
      <div class="skel-block" style="height:180px;border-radius:var(--r-8);"></div>
    </tokenops-page>
  </body>
</html>
