<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose. theme.js is a deferred ES module, so without this the
         skeleton flashes the OS theme. The rail width is set here too as the fallback for browsers
         without the `blocking` script attribute (Firefox), where app-header.js is still plain deferred
         and an expanded rail would collapse and re-expand on every MPA navigation.
         Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded-v2')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <!-- The page component's own sheet, linked rather than imported by its
         module, so the static shell below is fully styled at first paint.
         agents-page.js must therefore NOT also adopt it. -->
    <link rel="stylesheet" href="/common/components/agents-page.css" />
    <!-- The sibling views' sheets. Linked here rather than imported by their
         modules for the same reason: a view must be fully styled the instant the
         shell mounts it, and those modules are loaded on demand. -->
    <link rel="stylesheet" href="/common/components/your-agents-page.css" />
    <link rel="stylesheet" href="/common/components/add-agent-page.css" />
    <link rel="stylesheet" href="/common/components/builds-page.css" />
    <script type="module" src="/navigation.js"></script>
    <!-- blocking=render: the shell has to be painted (and view-transition-named)
         before the browser snapshots this document for the cross-document
         transition. A plain deferred module runs after that snapshot, so the
         incoming page was captured with an empty header and the whole shell
         cross-faded on every navigation. -->
    <script type="module" blocking="render" src="/common/components/app-header.js"></script>
    <script type="module" src="/common/components/module-shell.js"></script>
    <!-- Only the default view's module loads up front; module-shell imports the
         others the first time the nested sidebar opens them. -->
    <script type="module" src="/common/components/agents-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <module-shell module="agents" default-view="hub">
      <!-- Owned by the shell, not by any view: this is what makes switching
           views inside the module leave the sidebar untouched. -->
      <app-module-nav module="agents"></app-module-nav>
      <agents-page data-view="hub" data-title="Agent hub">
      <!-- Static shell: everything that needs no backend, in the component's
           own class names so it paints for real before the module loads. The
           component binds to these nodes instead of re-rendering them, and
           fills only the two API-fed regions (#category-tabs, #agents-grid),
           which start as the same skeletons the component would draw. -->
      <div class="page-top">
        <h1 class="title-page">Agent hub</h1>
        <!-- Deliberately count-free: the fleet size lands in the "All N" tab.
             Injecting it here reflowed the description (2 → 3 lines on mobile)
             the moment the API answered. -->
        <p class="subtitle">Discover and chat with the agents deployed on this cluster.</p>
      </div>
      <div class="controls">
        <div class="search-wrap">
          <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px;flex-shrink:0"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
          <input type="search" id="search-input" placeholder="Search agents by name, skill, or capability" />
          <button class="search-clear" id="search-clear" aria-label="Clear search" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
      <div class="type-tabs" id="category-tabs" role="tablist">
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
      </div>
      <div class="grid" id="agents-grid">
        <div class="card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc1"></div>
          <div class="skel-line skel-line--desc2"></div>
        </div>
        <div class="card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc1"></div>
          <div class="skel-line skel-line--desc2"></div>
        </div>
        <div class="card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc1"></div>
          <div class="skel-line skel-line--desc2"></div>
        </div>
        <div class="card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc1"></div>
          <div class="skel-line skel-line--desc2"></div>
        </div>
        <div class="card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc1"></div>
          <div class="skel-line skel-line--desc2"></div>
        </div>
        <div class="card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc1"></div>
          <div class="skel-line skel-line--desc2"></div>
        </div>
      </div>
      </agents-page>
      <!-- Deferred views: a <template> keeps these elements un-upgraded, so
           they run no code and issue no requests until first opened. -->
      <template data-view="your-agents" data-title="Your agents"
                data-module="/common/components/your-agents-page.js">
        <your-agents-page></your-agents-page>
      </template>
      <template data-view="import" data-title="Import agent"
                data-module="/common/components/add-agent-page.js">
        <add-agent-page></add-agent-page>
      </template>
      <template data-view="builds" data-title="Builds"
                data-module="/common/components/builds-page.js">
        <builds-page></builds-page>
      </template>
    </module-shell>
  </body>
</html>
