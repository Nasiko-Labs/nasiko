[package]
name = "nasiko-observability"
edition.workspace = true
version.workspace = true

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { version = "0.28", features = ["metrics"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["grpc-tonic", "metrics", "trace"] }
opentelemetry-semantic-conventions = "0.28"
tracing-opentelemetry = "0.29"
tonic = "0.12"
reqwest = { workspace = true }
async-trait = "0.1"
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nasiko-runtime = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
