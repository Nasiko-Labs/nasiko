[project]
name = "google-adk-research-agent"
version = "1.0.0"
description = "Wikipedia research agent built with Google ADK"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "google-adk>=1.0.0",
    "httpx>=0.27.0",
    "a2a-sdk[http-server]>=0.3.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "click>=8.0.0",
]
