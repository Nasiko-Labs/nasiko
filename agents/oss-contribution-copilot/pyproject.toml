[project]
name = "oss-contribution-copilot"
version = "1.0.0"
description = "A2A adapter exposing the OSS Contribution Copilot — an agent that finds, claims, plans, implements and ships open-source contributions under human approval gates."
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-distro>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-starlette>=0.46b0",
    "opentelemetry-instrumentation-openai-v2>=2.0b0",
    "opentelemetry-instrumentation-anthropic>=0.35.0b0",
    "httpx>=0.27.0",
    "a2a-sdk[http-server]>=0.3.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "click>=8.0.0",
]
