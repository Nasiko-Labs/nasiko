[project]
name = "oss-contribution-copilot"
version = "1.0.0"
description = "Governed open-source contribution agent: human approval gates, repo allow-list, cost budget"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.1.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
    "click>=8.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-starlette>=0.46b0",
    "opentelemetry-instrumentation-openai-v2>=2.0b0",
]
