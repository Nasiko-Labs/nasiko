[project]
name = "nasiko-evidencebridge-agent"
version = "1.0.0"
description = "Supplier claim verification agent that researches public evidence and returns traceable verification findings before payment."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.1.0",
    "starlette==1.3.1",
    "uvicorn==0.48.0",
    "click==8.4.1",
    "httpx==0.28.1",
    "opentelemetry-distro>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1",
]

[tool.setuptools]
py-modules = ["main", "telemetry"]
