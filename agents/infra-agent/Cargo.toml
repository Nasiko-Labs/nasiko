[package]
name = "nasiko-infra-agent"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
a2a-server = { git = "https://github.com/a2aproject/a2a-rs", package = "a2a-server-lf" }
a2a = { git = "https://github.com/a2aproject/a2a-rs", package = "a2a-lf" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.28", features = ["metrics"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.28"
tracing-opentelemetry = "0.29"
